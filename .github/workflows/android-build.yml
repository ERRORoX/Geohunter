name: Android build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android-native
  pull_request:
    branches:
      - main

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare offline OCR language models
        run: |
          mkdir -p android/app/src/main/assets/tessdata
          curl --fail --location --retry 3 \
            https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/rus.traineddata \
            --output android/app/src/main/assets/tessdata/rus.traineddata
          curl --fail --location --retry 3 \
            https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata \
            --output android/app/src/main/assets/tessdata/eng.traineddata
          test "$(stat -c%s android/app/src/main/assets/tessdata/rus.traineddata)" -gt 1000000
          test "$(stat -c%s android/app/src/main/assets/tessdata/eng.traineddata)" -gt 1000000

      - name: Build debug APKs (one per CPU architecture)
        run: gradle -p android assembleDebug

      - name: Upload architecture-specific APKs
        uses: actions/upload-artifact@v4
        with:
          name: geohunter-android-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
