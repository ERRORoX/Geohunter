<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060608" />
    <title>Фото — GeoHunter</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23060608' width='32' height='32' rx='4'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%2300ff88' font-family='monospace'>G</text></svg>"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/proba-theme.css" />
    <link rel="stylesheet" href="./css/photo.css" />
</head>
<body>
    <div class="osint-bg cyber-grid" aria-hidden="true"></div>

    <header class="osint-header app-header">
      <div class="osint-header-inner scan-line">
        <div class="osint-logo" aria-hidden="true">
          <a href="/photo/" style="color: inherit; display: flex" title="GeoHunter — фото">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </a>
        </div>
        <div class="osint-title">
          <h1>
            <span class="accent">Geo</span><span class="dim">Hunter</span>
          </h1>
          <p>Поиск по фотографии · EXIF, обратный поиск, OCR, QR</p>
        </div>
        <div class="app-header-right">
          <div class="photo-header-actions">
            <span class="badge badge-amber pulse" id="badgeRunning" style="display: none">0 активны</span>
            <span class="badge badge-done" id="badgeDone" style="display: none">0/0</span>
            <button type="button" class="btn" id="btnExport" style="display: none" onclick="GeoHunter.exportReport()" aria-label="Экспорт Markdown" title="Скачать отчёт (.md)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
            </button>
            <button type="button" class="btn" id="btnExportJson" style="display: none" onclick="GeoHunter.exportJson()" aria-label="Экспорт JSON" title="Скачать данные (.json)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <path d="M10 12h4M10 16h4" />
              </svg>
            </button>
          </div>
          <span class="app-header-system" id="header-system">ОС: —</span>
        </div>
      </div>
    </header>

    <div class="app-body osint-body">
      <div class="photo-shell">
        <div class="upload-section">
          <div class="upload-inner" id="uploadArea"></div>
        </div>
        <main class="main osint-main osint-scrollbar" id="mainArea"></main>
      </div>
    </div>

    <div id="map-container" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#060608">
      <button type="button" id="btn-close-full-map" style="position:absolute;top:20px;right:20px;z-index:10000;padding:10px 20px;background:#ff4444;color:white;border:none;border-radius:5px;cursor:pointer">Закрыть</button>
      <div class="gps-map photo-cyber-map photo-map--exif" style="width:100%;height:100%">
        <div id="photo-leaflet-fullscreen" class="photo-leaflet-root"></div>
      </div>
    </div>

    <script defer src="/js/header-env.js"></script>
    <script defer src="/js/header-ui.js"></script>
    <script type="module" src="./js/photo-app.js"></script>
</body>
</html>
